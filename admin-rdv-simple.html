<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin RDV - Version Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-center">Admin Rendez-vous - Version Simple</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex gap-4 mb-4">
                <button onclick="chargerRdv()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-semibold">
                    🔄 Charger les RDV
                </button>
                <button onclick="viderCache()" class="bg-gray-600 text-white px-6 py-2 rounded hover:bg-gray-700 font-semibold">
                    🧹 Vider Cache
                </button>
            </div>
            
            <div id="message" class="hidden p-4 rounded mb-4"></div>
            
            <div id="rdvContainer">
                <p class="text-gray-500 text-center py-8">Cliquez sur "Charger les RDV" pour commencer</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let rdvList = [];
        
        function afficherMessage(texte, type = 'info') {
            const messageDiv = document.getElementById('message');
            const couleurs = {
                success: 'bg-green-100 text-green-800 border border-green-200',
                error: 'bg-red-100 text-red-800 border border-red-200',
                info: 'bg-blue-100 text-blue-800 border border-blue-200'
            };
            
            messageDiv.className = `p-4 rounded mb-4 ${couleurs[type]}`;
            messageDiv.textContent = texte;
            messageDiv.classList.remove('hidden');
            
            setTimeout(() => messageDiv.classList.add('hidden'), 5000);
        }
        
        function viderCache() {
            rdvList = [];
            document.getElementById('rdvContainer').innerHTML = '<p class="text-gray-500 text-center py-8">Cache vidé</p>';
            afficherMessage('Cache vidé', 'success');
        }
        
        async function chargerRdv() {
            try {
                afficherMessage('Chargement des rendez-vous...', 'info');
                
                const response = await fetch(`${API_URL}/rendezvous?t=${Date.now()}`, {
                    method: 'GET',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache'
                    }
                });
                
                const data = await response.json();
                
                if (data.success && data.data) {
                    rdvList = data.data;
                    afficherMessage(`${rdvList.length} rendez-vous chargés`, 'success');
                    afficherRdv();
                } else {
                    afficherMessage('Erreur de chargement', 'error');
                }
            } catch (error) {
                afficherMessage('Erreur de connexion', 'error');
                console.error(error);
            }
        }
        
        function afficherRdv() {
            const container = document.getElementById('rdvContainer');
            
            if (rdvList.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">Aucun rendez-vous trouvé</p>';
                return;
            }
            
            container.innerHTML = rdvList.map(rdv => {
                const couleurStatut = {
                    'Confirmé': 'bg-green-500 text-white',
                    'En attente': 'bg-yellow-500 text-white',
                    'Annulé': 'bg-red-500 text-white'
                };
                
                return `
                    <div class="border rounded-lg p-6 mb-4 bg-gray-50">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-bold">${rdv.date} à ${rdv.heure}</h3>
                                <p class="text-gray-700 text-lg">${rdv.patient.prenom} ${rdv.patient.nom}</p>
                                <p class="text-gray-600">Dr. ${rdv.medecin.prenom} ${rdv.medecin.nom}</p>
                                <p class="text-sm text-gray-500">ID: ${rdv.id.substring(0,8)}...</p>
                            </div>
                            <div class="text-center">
                                <div class="px-4 py-2 rounded-lg text-lg font-bold ${couleurStatut[rdv.statut] || 'bg-gray-500 text-white'}">
                                    ${rdv.statut}
                                </div>
                            </div>
                        </div>
                        
                        <div class="border-t pt-4">
                            <p class="text-sm text-gray-600 mb-3">Changer le statut :</p>
                            <div class="flex gap-3 justify-center">
                                <button onclick="changerStatut('${rdv.id}', 'En attente')" 
                                        class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600 font-semibold ${rdv.statut === 'En attente' ? 'opacity-50' : ''}">
                                    ⏳ En attente
                                </button>
                                <button onclick="changerStatut('${rdv.id}', 'Confirmé')" 
                                        class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 font-semibold ${rdv.statut === 'Confirmé' ? 'opacity-50' : ''}">
                                    ✅ Confirmé
                                </button>
                                <button onclick="changerStatut('${rdv.id}', 'Annulé')" 
                                        class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 font-semibold ${rdv.statut === 'Annulé' ? 'opacity-50' : ''}">
                                    ❌ Annulé
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function changerStatut(rdvId, nouveauStatut) {
            const rdv = rdvList.find(r => r.id === rdvId);
            if (!rdv) return;
            
            if (rdv.statut === nouveauStatut) {
                afficherMessage(`Le statut est déjà "${nouveauStatut}"`, 'info');
                return;
            }
            
            try {
                afficherMessage(`Modification vers "${nouveauStatut}"...`, 'info');
                
                // Modification immédiate dans l'interface
                rdv.statut = nouveauStatut;
                afficherRdv();
                
                // Envoi de la requête
                const response = await fetch(`${API_URL}/rendezvous/${rdvId}/statut`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ statut: nouveauStatut })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    afficherMessage(`✅ Statut modifié vers "${nouveauStatut}" avec succès!`, 'success');
                    
                    // Vérification après 2 secondes
                    setTimeout(async () => {
                        const verifyResponse = await fetch(`${API_URL}/rendezvous?t=${Date.now()}`);
                        const verifyData = await verifyResponse.json();
                        
                        if (verifyData.success) {
                            const verifiedRdv = verifyData.data.find(r => r.id === rdvId);
                            if (verifiedRdv && verifiedRdv.statut === nouveauStatut) {
                                console.log('✅ Vérification OK:', verifiedRdv.statut);
                            } else {
                                console.log('⚠️ Différence détectée, rechargement...');
                                rdvList = verifyData.data;
                                afficherRdv();
                            }
                        }
                    }, 2000);
                    
                } else {
                    // Annuler la modification dans l'interface
                    await chargerRdv();
                    afficherMessage('Erreur lors de la modification', 'error');
                }
                
            } catch (error) {
                // Annuler la modification dans l'interface
                await chargerRdv();
                afficherMessage('Erreur de connexion', 'error');
                console.error(error);
            }
        }
        
        // Chargement automatique
        window.addEventListener('load', chargerRdv);
    </script>
</body>
</html>
