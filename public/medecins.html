<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGSP - Gestion des Médecins</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
</head>
<body class="bg-gray-50">
    <!-- Notification -->
    <div id="notification" class="hidden fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-2xl text-white min-w-[300px]"></div>

    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <!-- Main Content -->
    <div class="main-content min-h-screen">
        <!-- Header -->
        <header class="bg-gradient-to-r from-sky-800 to-sky-900 border-b border-sky-700 px-8 py-6 shadow-lg">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-white">Gestion des Médecins</h1>
                    <p class="text-sky-200 mt-1 font-medium">Gérer et suivre tous les médecins du centre hospitalier</p>
                </div>
                <button onclick="openModal()" class="bg-white text-sky-800 px-6 py-3 rounded-xl font-semibold hover:bg-sky-50 transition-all duration-300 shadow-lg hover:shadow-xl flex items-center gap-2">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    Nouveau Médecin
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="p-8">
            <!-- Barre de recherche -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
                <div class="flex gap-4">
                    <input type="text" id="searchInput" placeholder="Rechercher un médecin..." 
                           class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    <button onclick="searchMedecins()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 transition">
                        Rechercher
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500">Total Médecins</p>
                            <h3 id="totalMedecins" class="text-3xl font-bold text-gray-900 mt-2">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center">
                            <svg class="text-blue-600" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500">Spécialités</p>
                            <h3 id="totalSpecialites" class="text-3xl font-bold text-gray-900 mt-2">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-purple-50 rounded-xl flex items-center justify-center">
                            <svg class="text-purple-600" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500">Consultations</p>
                            <h3 id="totalConsultations" class="text-3xl font-bold text-gray-900 mt-2">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-green-50 rounded-xl flex items-center justify-center">
                            <svg class="text-green-600" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Liste des médecins -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <h2 class="text-xl font-bold text-gray-900 mb-6">Liste des Médecins</h2>
                
                <!-- Loading -->
                <div id="loading" class="text-center py-8">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="mt-4 text-gray-600">Chargement des médecins...</p>
                </div>

                <!-- Médecins Grid -->
                <div id="medecinsGrid" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Les médecins seront affichés ici -->
                </div>

                <!-- Aucun médecin -->
                <div id="noMedecins" class="hidden text-center py-12">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <h3 class="mt-2 text-sm font-medium text-gray-900">Aucun médecin trouvé</h3>
                    <p class="mt-1 text-sm text-gray-500">Commencez par ajouter votre premier médecin</p>
                    <button onclick="openModal()" class="mt-6 bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                        Ajouter un médecin
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Nouveau/Modifier Médecin -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 id="modalTitle" class="text-2xl font-bold text-gray-900">Nouveau Médecin</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <form id="medecinForm" class="p-6 space-y-4">
                <input type="hidden" id="medecinId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Nom *</label>
                        <input type="text" id="nom" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Prénom *</label>
                        <input type="text" id="prenom" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Spécialité *</label>
                        <select id="specialite" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="">Sélectionnez une spécialité...</option>
                            <option value="Médecine Générale">Médecine Générale</option>
                            <option value="Cardiologie">Cardiologie</option>
                            <option value="Pédiatrie">Pédiatrie</option>
                            <option value="Dermatologie">Dermatologie</option>
                            <option value="Gynécologie">Gynécologie</option>
                            <option value="Orthopédie">Orthopédie</option>
                            <option value="ORL">ORL</option>
                            <option value="Ophtalmologie">Ophtalmologie</option>
                            <option value="Psychiatrie">Psychiatrie</option>
                            <option value="Radiologie">Radiologie</option>
                            <option value="Chirurgie">Chirurgie</option>
                            <option value="Neurologie">Neurologie</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">N° Ordre *</label>
                        <input type="text" id="numeroOrdre" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Téléphone *</label>
                        <input type="tel" id="telephone" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email *</label>
                        <input type="email" id="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Adresse</label>
                        <textarea id="adresse" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>
                </div>
                
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-xl font-semibold hover:bg-gray-50 transition">
                        Annuler
                    </button>
                    <button type="submit" class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-xl font-semibold hover:bg-blue-700 transition">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let allMedecins = [];
        let currentMedecinId = null;

        // Fonction de notification
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            
            notification.className = `fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-2xl text-white min-w-[300px] ${colors[type]}`;
            notification.textContent = message;
            notification.classList.remove('hidden');
            
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 5000);
        }

        // Charger les médecins
        async function loadMedecins() {
            console.log('🔄 Chargement des médecins...');
            
            try {
                const response = await fetch(`${API_URL}/medecins`);
                console.log('📡 Réponse API:', response.status);
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('📊 Données reçues:', data);
                
                if (data.success && data.data) {
                    allMedecins = data.data;
                    console.log('✅ Médecins chargés:', allMedecins.length);
                    displayMedecins(allMedecins);
                    updateStats(allMedecins);
                } else {
                    throw new Error('Format de données incorrect');
                }
                
            } catch (error) {
                console.error('❌ Erreur chargement:', error);
                showNotification('Erreur de chargement des médecins', 'error');
                showNoMedecins();
            }
        }

        // Afficher les médecins
        function displayMedecins(medecins) {
            console.log('🎨 Affichage de', medecins.length, 'médecins');
            
            const loading = document.getElementById('loading');
            const grid = document.getElementById('medecinsGrid');
            const noMedecins = document.getElementById('noMedecins');
            
            loading.classList.add('hidden');
            
            if (medecins.length === 0) {
                showNoMedecins();
                return;
            }
            
            noMedecins.classList.add('hidden');
            grid.classList.remove('hidden');
            
            grid.innerHTML = medecins.map(medecin => `
                <div class="bg-white border border-gray-200 rounded-xl p-6 hover:shadow-lg transition-shadow">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                <span class="text-blue-600 font-bold">${medecin.prenom.charAt(0)}${medecin.nom.charAt(0)}</span>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900">Dr. ${medecin.prenom} ${medecin.nom}</h3>
                                <p class="text-sm text-blue-600 font-medium">${medecin.specialite}</p>
                            </div>
                        </div>
                        <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-medium">Actif</span>
                    </div>
                    
                    <div class="space-y-2 mb-4">
                        <div class="flex items-center gap-2 text-sm text-gray-600">
                            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                            </svg>
                            <span>${medecin.telephone}</span>
                        </div>
                        <div class="flex items-center gap-2 text-sm text-gray-600">
                            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                            </svg>
                            <span class="truncate">${medecin.email}</span>
                        </div>
                        ${medecin.numeroOrdre ? `
                        <div class="flex items-center gap-2 text-sm text-gray-600">
                            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 2 2h8c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 7h-2V5h2v4z"/>
                            </svg>
                            <span>N° ${medecin.numeroOrdre}</span>
                        </div>
                        ` : ''}
                    </div>
                    
                    ${medecin.id ? `
                    <div class="flex gap-2">
                        <button onclick="editMedecin('${medecin.id}')" class="flex-1 bg-blue-50 text-blue-600 px-3 py-2 rounded-lg text-sm font-medium hover:bg-blue-100 transition">
                            Modifier
                        </button>
                        <button onclick="deleteMedecin('${medecin.id}', '${medecin.prenom} ${medecin.nom}')" class="flex-1 bg-red-50 text-red-600 px-3 py-2 rounded-lg text-sm font-medium hover:bg-red-100 transition">
                            Supprimer
                        </button>
                    </div>
                    ` : `
                    <div class="text-center">
                        <span class="text-xs text-gray-400">Médecin sans ID - Affichage seulement</span>
                    </div>
                    `}
                </div>
            `).join('');
        }

        // Afficher message aucun médecin
        function showNoMedecins() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('medecinsGrid').classList.add('hidden');
            document.getElementById('noMedecins').classList.remove('hidden');
        }

        // Mettre à jour les statistiques
        function updateStats(medecins) {
            document.getElementById('totalMedecins').textContent = medecins.length;
            
            const specialites = [...new Set(medecins.map(m => m.specialite))];
            document.getElementById('totalSpecialites').textContent = specialites.length;
            
            // Charger le nombre de consultations
            fetch(`${API_URL}/consultations`)
                .then(response => response.json())
                .then(data => {
                    const count = data.success ? (data.count || data.data?.length || 0) : 0;
                    document.getElementById('totalConsultations').textContent = count;
                })
                .catch(() => {
                    document.getElementById('totalConsultations').textContent = '0';
                });
        }

        // Rechercher médecins
        function searchMedecins() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!query) {
                displayMedecins(allMedecins);
                return;
            }
            
            const filtered = allMedecins.filter(medecin => 
                medecin.nom?.toLowerCase().includes(query) ||
                medecin.prenom?.toLowerCase().includes(query) ||
                medecin.specialite?.toLowerCase().includes(query) ||
                medecin.telephone?.includes(query) ||
                medecin.email?.toLowerCase().includes(query)
            );
            
            displayMedecins(filtered);
        }

        // Ouvrir modal
        function openModal() {
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = 'Nouveau Médecin';
            clearForm();
        }

        // Fermer modal
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            clearForm();
        }

        // Vider formulaire
        function clearForm() {
            document.getElementById('medecinId').value = '';
            document.getElementById('nom').value = '';
            document.getElementById('prenom').value = '';
            document.getElementById('specialite').value = '';
            document.getElementById('numeroOrdre').value = '';
            document.getElementById('telephone').value = '';
            document.getElementById('email').value = '';
            document.getElementById('adresse').value = '';
            currentMedecinId = null;
        }

        // Sauvegarder médecin
        async function saveMedecin(event) {
            event.preventDefault();
            
            const medecinData = {
                nom: document.getElementById('nom').value,
                prenom: document.getElementById('prenom').value,
                specialite: document.getElementById('specialite').value,
                numeroOrdre: document.getElementById('numeroOrdre').value,
                telephone: document.getElementById('telephone').value,
                email: document.getElementById('email').value,
                adresse: document.getElementById('adresse').value
            };

            const url = currentMedecinId 
                ? `${API_URL}/medecins/${currentMedecinId}`
                : `${API_URL}/medecins`;
            const method = currentMedecinId ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(medecinData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification(currentMedecinId ? 'Médecin modifié avec succès' : 'Médecin créé avec succès', 'success');
                    closeModal();
                    loadMedecins();
                } else {
                    showNotification(data.message || 'Erreur lors de l\'enregistrement', 'error');
                }
            } catch (error) {
                showNotification('Erreur de connexion au serveur', 'error');
            }
        }

        // Modifier médecin
        async function editMedecin(id) {
            try {
                const response = await fetch(`${API_URL}/medecins/${id}`);
                const data = await response.json();
                
                if (data.success) {
                    const medecin = data.data;
                    currentMedecinId = id;
                    
                    document.getElementById('nom').value = medecin.nom || '';
                    document.getElementById('prenom').value = medecin.prenom || '';
                    document.getElementById('specialite').value = medecin.specialite || '';
                    document.getElementById('numeroOrdre').value = medecin.numeroOrdre || '';
                    document.getElementById('telephone').value = medecin.telephone || '';
                    document.getElementById('email').value = medecin.email || '';
                    document.getElementById('adresse').value = medecin.adresse || '';
                    
                    document.getElementById('modalTitle').textContent = 'Modifier Médecin';
                    document.getElementById('modal').classList.remove('hidden');
                } else {
                    showNotification('Erreur lors du chargement du médecin', 'error');
                }
            } catch (error) {
                showNotification('Erreur de connexion', 'error');
            }
        }

        // Supprimer médecin
        async function deleteMedecin(id, nom) {
            if (!confirm(`Êtes-vous sûr de vouloir supprimer Dr. ${nom} ?\n\nCette action est irréversible.`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/medecins/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification(`Dr. ${nom} supprimé avec succès`, 'success');
                    loadMedecins();
                } else {
                    showNotification(data.message || 'Erreur lors de la suppression', 'error');
                }
            } catch (error) {
                showNotification('Erreur de connexion', 'error');
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMedecins();
        });

        document.getElementById('medecinForm').addEventListener('submit', saveMedecin);

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            // Charger la sidebar
            document.getElementById('sidebarContainer').innerHTML = createSidebar('medecins');
            
            // Charger les médecins
            loadMedecins();
        });
    </script>

    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
</body>
</html>
