<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGSP - Admin RDV</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h1 class="text-3xl font-bold text-center">Administration - Rendez-vous</h1>
        </div>
        
        <!-- Statistiques -->
        <div class="grid grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-blue-600" id="totalRdv">-</div>
                <div class="text-sm text-gray-600">Total</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-green-600" id="confirmedRdv">-</div>
                <div class="text-sm text-gray-600">Confirmés</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-yellow-600" id="pendingRdv">-</div>
                <div class="text-sm text-gray-600">En attente</div>
            </div>
            <div class="bg-white rounded-lg shadow p-6 text-center">
                <div class="text-3xl font-bold text-red-600" id="cancelledRdv">-</div>
                <div class="text-sm text-gray-600">Annulés</div>
            </div>
        </div>
        
        <!-- Contrôles -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold">Gestion des Rendez-vous</h2>
                <div class="space-x-2">
                    <button onclick="chargerRdv()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                        🔄 Actualiser
                    </button>
                    <select id="filtreStatut" onchange="filtrerParStatut()" class="border rounded px-3 py-2">
                        <option value="">Tous les statuts</option>
                        <option value="Confirmé">Confirmés</option>
                        <option value="En attente">En attente</option>
                        <option value="Annulé">Annulés</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Liste des RDV -->
        <div class="bg-white rounded-lg shadow p-6">
            <div id="rdv-container">
                <p class="text-gray-500">Chargement...</p>
            </div>
        </div>
    </div>

    <script>
        let tousLesRdv = [];
        
        document.addEventListener('DOMContentLoaded', chargerRdv);
        
        async function chargerRdv() {
            const container = document.getElementById('rdv-container');
            
            try {
                container.innerHTML = '<p class="text-blue-600">🔄 Chargement des rendez-vous...</p>';
                
                const response = await fetch('/api/rendezvous');
                const result = await response.json();
                
                console.log('📊 Réponse API Admin:', result);
                
                if (result.success && result.data) {
                    tousLesRdv = result.data;
                    
                    // Mettre à jour les statistiques
                    const total = tousLesRdv.length;
                    const confirmed = tousLesRdv.filter(r => r.statut === 'Confirmé').length;
                    const pending = tousLesRdv.filter(r => r.statut === 'En attente').length;
                    const cancelled = tousLesRdv.filter(r => r.statut === 'Annulé').length;
                    
                    document.getElementById('totalRdv').textContent = total;
                    document.getElementById('confirmedRdv').textContent = confirmed;
                    document.getElementById('pendingRdv').textContent = pending;
                    document.getElementById('cancelledRdv').textContent = cancelled;
                    
                    afficherRdv(tousLesRdv);
                } else {
                    container.innerHTML = `
                        <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                            <p class="text-red-800 font-semibold">❌ Erreur de chargement</p>
                            <p class="text-red-600">${result.error || 'Erreur inconnue'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('❌ Erreur:', error);
                container.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                        <p class="text-red-800 font-semibold">❌ Erreur de connexion</p>
                        <p class="text-red-600">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function afficherRdv(rdvs) {
            const container = document.getElementById('rdv-container');
            
            if (rdvs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <div class="text-6xl mb-4">📅</div>
                        <h3 class="text-xl font-semibold text-gray-600 mb-2">Aucun rendez-vous</h3>
                        <p class="text-gray-500">Aucun rendez-vous ne correspond aux critères</p>
                    </div>
                `;
                return;
            }
            
            // Trier par date (plus récents en premier)
            rdvs.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            container.innerHTML = rdvs.map((rdv, index) => {
                const couleurs = {
                    'Confirmé': 'bg-green-50 border-green-200',
                    'En attente': 'bg-yellow-50 border-yellow-200',
                    'Annulé': 'bg-red-50 border-red-200'
                };
                
                const badges = {
                    'Confirmé': 'bg-green-100 text-green-800',
                    'En attente': 'bg-yellow-100 text-yellow-800',
                    'Annulé': 'bg-red-100 text-red-800'
                };
                
                return `
                    <div class="border rounded-lg p-4 mb-4 ${couleurs[rdv.statut] || 'bg-gray-50'}">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <h3 class="font-semibold text-lg">
                                    📅 ${rdv.date} à ${rdv.heure}
                                </h3>
                                <div class="mt-2 space-y-1">
                                    <p class="text-gray-700">
                                        👤 <strong>Patient:</strong> ${rdv.patient?.prenom} ${rdv.patient?.nom}
                                        <span class="text-sm text-gray-500">(${rdv.patient?.email})</span>
                                    </p>
                                    <p class="text-gray-700">
                                        👨‍⚕️ <strong>Médecin:</strong> Dr. ${rdv.medecin?.prenom} ${rdv.medecin?.nom}
                                        <span class="text-sm text-gray-500">(${rdv.medecin?.specialite})</span>
                                    </p>
                                    ${rdv.motif ? `<p class="text-gray-600">📝 <strong>Motif:</strong> ${rdv.motif}</p>` : ''}
                                    ${rdv.notes ? `<p class="text-gray-600">📋 <strong>Notes:</strong> ${rdv.notes}</p>` : ''}
                                </div>
                                
                                <div class="mt-4 space-x-2">
                                    ${rdv.statut === 'En attente' ? `
                                        <button onclick="changerStatut('${rdv.id}', 'Confirmé')" 
                                                class="bg-green-100 text-green-700 px-3 py-1 rounded text-sm hover:bg-green-200">
                                            ✅ Confirmer
                                        </button>
                                    ` : ''}
                                    ${rdv.statut !== 'Annulé' ? `
                                        <button onclick="changerStatut('${rdv.id}', 'Annulé')" 
                                                class="bg-red-100 text-red-700 px-3 py-1 rounded text-sm hover:bg-red-200">
                                            ❌ Annuler
                                        </button>
                                    ` : ''}
                                    <button onclick="supprimerRdv('${rdv.id}')" 
                                            class="bg-gray-100 text-gray-700 px-3 py-1 rounded text-sm hover:bg-gray-200">
                                        🗑️ Supprimer
                                    </button>
                                    <button onclick="modifierRdv('${rdv.id}')" 
                                            class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-200">
                                        ✏️ Modifier
                                    </button>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="px-3 py-1 rounded-full text-sm font-medium ${badges[rdv.statut] || 'bg-gray-100 text-gray-800'}">
                                    ${rdv.statut}
                                </span>
                                <p class="text-xs text-gray-500 mt-2">ID: ${rdv.id.substring(0, 8)}...</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function filtrerParStatut() {
            const filtre = document.getElementById('filtreStatut').value;
            
            if (filtre === '') {
                afficherRdv(tousLesRdv);
            } else {
                const rdvFiltres = tousLesRdv.filter(rdv => rdv.statut === filtre);
                afficherRdv(rdvFiltres);
            }
        }
        
        async function changerStatut(rdvId, statut) {
            const action = statut === 'Confirmé' ? 'confirmer' : 'annuler';
            
            if (confirm(`Êtes-vous sûr de vouloir ${action} ce rendez-vous ?`)) {
                try {
                    const response = await fetch(`/api/rendezvous/${rdvId}/statut`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ statut })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert(`✅ Rendez-vous ${action} avec succès`);
                        chargerRdv(); // Recharger
                    } else {
                        alert('❌ Erreur lors du changement de statut');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    alert('❌ Erreur de connexion');
                }
            }
        }
        
        async function supprimerRdv(rdvId) {
            if (confirm('⚠️ Êtes-vous sûr de vouloir supprimer définitivement ce rendez-vous ?\\n\\nCette action est irréversible.')) {
                try {
                    const response = await fetch(`/api/rendezvous/${rdvId}`, {
                        method: 'DELETE'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('✅ Rendez-vous supprimé avec succès');
                        chargerRdv(); // Recharger
                    } else {
                        alert('❌ Erreur lors de la suppression');
                    }
                } catch (error) {
                    console.error('Erreur:', error);
                    alert('❌ Erreur de connexion');
                }
            }
        }
        
        function modifierRdv(rdvId) {
            alert(`🔧 Fonction de modification en développement\\n\\nID: ${rdvId}`);
            // Ici on pourrait ouvrir un modal de modification
        }
    </script>
</body>
</html>
