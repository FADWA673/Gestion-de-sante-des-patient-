<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGSP - Connexion Patient</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%);
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(139, 92, 246, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(168, 85, 247, 0.2) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .login-container {
            position: relative;
            z-index: 1;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <!-- Notification -->
    <div id="notification" class="hidden fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-2xl text-white min-w-[300px]"></div>

    <!-- Retour vers accueil -->
    <a href="/" class="fixed top-6 left-6 z-50 flex items-center gap-3 text-white hover:text-purple-200 transition-all duration-300 group">
        <div class="w-12 h-12 bg-white bg-opacity-20 rounded-2xl flex items-center justify-center group-hover:bg-opacity-30 transition shadow-lg">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </div>
        <span class="font-semibold">Retour à l'accueil</span>
    </a>

    <div class="login-container w-full max-w-lg">
        <div class="login-card rounded-3xl shadow-2xl p-8 md:p-12 animate-scale-in">
        <!-- Logo et Titre -->
        <div class="text-center mb-10">
            <div class="bg-gradient-to-br from-purple-500 to-purple-600 w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-xl">
                <svg class="text-white" width="48" height="48" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-gray-900 mb-3">Espace Patient</h1>
            <p class="text-gray-600 text-lg font-medium">Votre Espace Personnel de Santé</p>
            <div class="inline-flex items-center gap-3 bg-gradient-to-r from-purple-50 to-violet-50 text-purple-700 px-6 py-3 rounded-2xl text-sm font-semibold mt-4 border border-purple-200">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                Accès Sécurisé Patient
            </div>
        </div>

        <!-- Formulaire -->
        <form onsubmit="event.preventDefault(); loginPatient();" class="space-y-6">
            <div class="animate-slide-in" style="animation-delay: 0.1s">
                <label class="block text-gray-700 font-semibold mb-3 text-lg">
                    Nom d'utilisateur
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-6 w-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Entrez votre nom d'utilisateur patient"
                        class="w-full pl-14 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-100 transition-all text-lg bg-white"
                        required
                    >
                </div>
            </div>

            <div class="animate-slide-in" style="animation-delay: 0.2s">
                <label class="block text-gray-700 font-semibold mb-3 text-lg">
                    Mot de passe
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-6 w-6 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Entrez votre mot de passe"
                        class="w-full pl-14 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-purple-500 focus:ring-4 focus:ring-purple-100 transition-all text-lg bg-white"
                        required
                    >
                </div>
            </div>

            <div class="animate-slide-in" style="animation-delay: 0.3s">
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-purple-600 to-purple-700 text-white py-5 rounded-2xl font-bold text-lg hover:from-purple-700 hover:to-purple-800 transition-all duration-300 transform hover:scale-[1.02] shadow-xl hover:shadow-2xl flex items-center justify-center gap-3"
                >
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    Accéder à mon espace patient
                </button>
            </div>
        </form>

        <!-- Aide -->
        <div class="mt-10 p-6 bg-gradient-to-r from-purple-50 to-violet-50 rounded-2xl border border-purple-200 animate-slide-in" style="animation-delay: 0.4s">
            <div class="flex items-start gap-4">
                <div class="w-8 h-8 bg-purple-100 rounded-xl flex items-center justify-center flex-shrink-0 mt-1">
                    <svg class="w-5 h-5 text-purple-600" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                    </svg>
                </div>
                <div>
                    <p class="text-gray-800 font-semibold mb-2">Accès Patient</p>
                    <p class="text-gray-600 text-sm leading-relaxed">Utilisez les identifiants de votre compte patient créé par l'administrateur pour accéder à votre dossier médical personnel.</p>
                </div>
            </div>
        </div>

        <!-- Autres connexions -->
        <div class="mt-8 text-center">
            <p class="text-gray-500 text-sm mb-4">Autres interfaces</p>
            <div class="flex gap-3 justify-center">
                <a href="/login.html" class="text-blue-600 hover:text-blue-700 text-sm font-medium">Admin</a>
                <span class="text-gray-300">|</span>
                <a href="/login-medecin.html" class="text-green-600 hover:text-green-700 text-sm font-medium">Médecin</a>
            </div>
        </div>
    </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        function showNotification(type, message) {
            const notif = document.getElementById('notification');
            const typeClasses = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            
            notif.className = `fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-2xl text-white min-w-[300px] ${typeClasses[type] || typeClasses.info}`;
            notif.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="flex-shrink-0">
                        ${type === 'success' ? 
                            '<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>' :
                            type === 'error' ?
                            '<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>' :
                            '<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>'
                        }
                    </div>
                    <div class="flex-1">
                        <p class="font-semibold">${message}</p>
                    </div>
                </div>
            `;
            notif.classList.remove('hidden');
            setTimeout(() => notif.classList.add('hidden'), 5000);
        }

        async function loginPatient() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showNotification('error', '⚠️ Veuillez remplir tous les champs');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    const userRole = data.role || (data.data.user && data.data.user.role) || (data.data.role);
                    
                    // Vérifier que c'est bien un patient
                    if (userRole !== 'patient') {
                        showNotification('error', '❌ Ce compte n\'est pas un compte patient');
                        return;
                    }
                    
                    // Stocker les données utilisateur complètes
                    const fullUserData = data.data || data;
                    localStorage.setItem('user', JSON.stringify(fullUserData));
                    localStorage.setItem('isAuthenticated', 'true');
                    
                    console.log('✅ Données patient stockées:', fullUserData);
                    
                    showNotification('success', '✅ Connexion patient réussie !');
                    
                    setTimeout(() => {
                        window.location.href = '/patient-dashboard.html';
                    }, 1000);
                } else {
                    showNotification('error', '❌ ' + (data.message || 'Identifiants incorrects'));
                }
            } catch (error) {
                console.error('Erreur:', error);
                showNotification('error', '❌ Erreur de connexion au serveur');
            }
        }
    </script>
</body>
</html>
