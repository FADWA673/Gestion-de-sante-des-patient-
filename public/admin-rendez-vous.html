<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGSP - Gestion des Rendez-vous</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/sidebar.css">
</head>
<body class="bg-gray-50">
    <!-- Notification -->
    <div id="notification" class="hidden fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-2xl text-white min-w-[300px]"></div>

    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <!-- Main Content -->
    <div class="main-content min-h-screen">
        <!-- Header -->
        <header class="bg-gradient-to-r from-sky-800 to-sky-900 border-b border-sky-700 px-8 py-6 shadow-lg">
            <div class="flex items-center justify-between">
                <div class="animate-slide-right">
                    <h1 class="text-3xl font-bold text-white">Gestion des Rendez-vous</h1>
                    <p class="text-sky-200 mt-1 font-medium">Administrer tous les rendez-vous du système</p>
                </div>
                <div class="animate-slide-in">
                    <button onclick="loadRendezVous()" class="bg-white text-sky-800 px-6 py-3 rounded-xl font-semibold hover:bg-sky-50 transition-all duration-300 shadow-lg hover:shadow-xl flex items-center gap-2">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg>
                        Actualiser
                    </button>
                </div>
            </div>
        </header>

        <main class="p-8 bg-gradient-to-br from-sky-50 to-blue-50 min-h-screen">
            <!-- Statistiques -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500">Total</p>
                            <h3 id="totalRdv" class="text-3xl font-bold text-gray-900 mt-2">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center">
                            <svg class="text-blue-600" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500">Confirmés</p>
                            <h3 id="confirmedRdv" class="text-3xl font-bold text-green-600 mt-2">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-green-50 rounded-2xl flex items-center justify-center">
                            <svg class="text-green-600" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500">En attente</p>
                            <h3 id="pendingRdv" class="text-3xl font-bold text-yellow-600 mt-2">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-yellow-50 rounded-2xl flex items-center justify-center">
                            <svg class="text-yellow-600" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-gray-500">Annulés</p>
                            <h3 id="cancelledRdv" class="text-3xl font-bold text-red-600 mt-2">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center">
                            <svg class="text-red-600" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Liste des rendez-vous -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200">
                <div class="p-6 border-b border-gray-200">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-bold text-gray-900">Tous les Rendez-vous</h2>
                        <div class="flex gap-2">
                            <select id="statusFilter" onchange="filterByStatus()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                                <option value="">Tous les statuts</option>
                                <option value="En attente">En attente</option>
                                <option value="Confirmé">Confirmé</option>
                                <option value="Annulé">Annulé</option>
                            </select>
                            <button onclick="createNewRdv()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm">
                                + Nouveau RDV
                            </button>
                        </div>
                    </div>
                </div>

                <div class="p-6">
                    <div id="rdvList" class="space-y-4">
                        <div class="text-center py-8">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
                            <p class="text-gray-500 mt-2">Chargement des rendez-vous...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de modification -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-gray-900" id="modalTitle">Modifier le Rendez-vous</h3>
                    <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <form id="editForm" class="p-6 space-y-4">
                <input type="hidden" id="editRdvId">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                        <input type="date" id="editDate" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Heure</label>
                        <input type="time" id="editHeure" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Statut</label>
                    <select id="editStatut" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="En attente">En attente</option>
                        <option value="Confirmé">Confirmé</option>
                        <option value="Annulé">Annulé</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Motif</label>
                    <textarea id="editMotif" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Notes</label>
                    <textarea id="editNotes" rows="2" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition">
                        Sauvegarder
                    </button>
                    <button type="button" onclick="closeEditModal()" class="px-6 py-3 border border-gray-300 rounded-lg font-semibold hover:bg-gray-50 transition">
                        Annuler
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        let allRendezVous = [];
        let filteredRendezVous = [];

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            if (!checkAuth()) return;
            
            // Charger la sidebar
            document.getElementById('sidebarContainer').innerHTML = createSidebar('rendez-vous');
            
            // Charger les rendez-vous
            loadRendezVous();
        });

        // Charger tous les rendez-vous
        async function loadRendezVous() {
            try {
                console.log('🔄 CHARGEMENT DES RENDEZ-VOUS...');
                
                // Forcer le rechargement complet sans cache
                const timestamp = new Date().getTime();
                const randomParam = Math.random().toString(36).substring(7);
                
                const response = await fetch(`/api/rendezvous?t=${timestamp}&r=${randomParam}`, {
                    method: 'GET',
                    headers: {
                        'Cache-Control': 'no-cache, no-store, must-revalidate',
                        'Pragma': 'no-cache',
                        'Expires': '0'
                    }
                });
                
                const data = await response.json();
                
                if (data.success && data.data) {
                    // Vider complètement les anciennes données
                    allRendezVous = [];
                    filteredRendezVous = [];
                    
                    // Charger les nouvelles données
                    allRendezVous = data.data;
                    filteredRendezVous = [...allRendezVous];
                    
                    console.log(`✅ ${allRendezVous.length} RENDEZ-VOUS CHARGÉS`);
                    console.log('📋 STATUTS ACTUELS:');
                    allRendezVous.forEach(r => {
                        console.log(`   - ${r.id.substring(0,8)}: ${r.statut} (${r.patient.prenom} ${r.patient.nom})`);
                    });
                    
                    // Mettre à jour l'affichage
                    updateStatistics();
                    displayRendezVous();
                    
                    console.log('✅ AFFICHAGE MIS À JOUR');
                    
                } else {
                    console.error('❌ Erreur API:', data);
                    showNotification('Erreur de chargement des rendez-vous', 'error');
                }
            } catch (error) {
                console.error('❌ Erreur chargement:', error);
                showNotification('Erreur de connexion', 'error');
            }
        }

        // Mettre à jour les statistiques
        function updateStatistics() {
            const total = allRendezVous.length;
            const confirmed = allRendezVous.filter(r => r.statut === 'Confirmé').length;
            const pending = allRendezVous.filter(r => r.statut === 'En attente').length;
            const cancelled = allRendezVous.filter(r => r.statut === 'Annulé').length;
            
            document.getElementById('totalRdv').textContent = total;
            document.getElementById('confirmedRdv').textContent = confirmed;
            document.getElementById('pendingRdv').textContent = pending;
            document.getElementById('cancelledRdv').textContent = cancelled;
        }

        // Afficher les rendez-vous
        function displayRendezVous() {
            const container = document.getElementById('rdvList');
            
            if (filteredRendezVous.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <div class="text-gray-400 text-4xl mb-4">📅</div>
                        <p class="text-gray-500">Aucun rendez-vous trouvé</p>
                    </div>
                `;
                return;
            }

            // Trier par date
            const sortedRdv = [...filteredRendezVous].sort((a, b) => {
                const dateA = new Date(a.date + ' ' + a.heure);
                const dateB = new Date(b.date + ' ' + b.heure);
                return dateB - dateA; // Plus récent en premier
            });

            container.innerHTML = sortedRdv.map(rdv => {
                const rdvDate = new Date(rdv.date);
                const today = new Date();
                const isPast = rdvDate < today;
                
                const statusColors = {
                    'Confirmé': 'bg-green-100 text-green-800',
                    'En attente': 'bg-yellow-100 text-yellow-800',
                    'Annulé': 'bg-red-100 text-red-800'
                };

                return `
                    <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <h4 class="font-semibold text-gray-900">
                                        ${rdvDate.toLocaleDateString('fr-FR')} à ${rdv.heure}
                                        ${isPast ? ' (Passé)' : ''}
                                    </h4>
                                    <span class="px-3 py-1 rounded-full text-xs font-medium ${statusColors[rdv.statut] || 'bg-gray-100 text-gray-800'}">
                                        ${rdv.statut}
                                    </span>
                                </div>
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm text-gray-600">
                                    <div>
                                        <p><strong>Patient:</strong> ${rdv.patient.prenom} ${rdv.patient.nom}</p>
                                        <p><strong>Médecin:</strong> Dr. ${rdv.medecin.prenom} ${rdv.medecin.nom}</p>
                                    </div>
                                    <div>
                                        ${rdv.motif ? `<p><strong>Motif:</strong> ${rdv.motif}</p>` : ''}
                                        ${rdv.notes ? `<p><strong>Notes:</strong> ${rdv.notes}</p>` : ''}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex gap-2 ml-4">
                                <button onclick="editRendezVous('${rdv.id}')" 
                                        class="px-3 py-1 bg-blue-100 text-blue-700 text-xs rounded hover:bg-blue-200 transition">
                                    ✏️ Modifier
                                </button>
                                <button onclick="deleteRendezVous('${rdv.id}')" 
                                        class="px-3 py-1 bg-red-100 text-red-700 text-xs rounded hover:bg-red-200 transition">
                                    🗑️ Supprimer
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filtrer par statut
        function filterByStatus() {
            const selectedStatus = document.getElementById('statusFilter').value;
            
            if (selectedStatus === '') {
                filteredRendezVous = [...allRendezVous];
            } else {
                filteredRendezVous = allRendezVous.filter(rdv => rdv.statut === selectedStatus);
            }
            
            displayRendezVous();
        }

        // Modifier un rendez-vous
        function editRendezVous(rdvId) {
            const rdv = allRendezVous.find(r => r.id === rdvId);
            if (!rdv) return;

            // Pré-remplir le formulaire
            document.getElementById('editRdvId').value = rdv.id;
            document.getElementById('editDate').value = rdv.date;
            document.getElementById('editHeure').value = rdv.heure;
            document.getElementById('editStatut').value = rdv.statut;
            document.getElementById('editMotif').value = rdv.motif || '';
            document.getElementById('editNotes').value = rdv.notes || '';

            // Afficher le modal
            document.getElementById('editModal').classList.remove('hidden');
        }

        // Fermer le modal
        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        // Soumettre les modifications
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const rdvId = document.getElementById('editRdvId').value;
            const newStatut = document.getElementById('editStatut').value;
            const newDate = document.getElementById('editDate').value;
            const newHeure = document.getElementById('editHeure').value;
            const newMotif = document.getElementById('editMotif').value;
            const newNotes = document.getElementById('editNotes').value;
            
            console.log('🔄 MODIFICATION DIRECTE');
            console.log('- RDV ID:', rdvId);
            console.log('- Nouveau statut:', newStatut);
            
            // Désactiver le bouton
            const submitBtn = document.querySelector('#editForm button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Modification...';
            
            try {
                // MODIFICATION DU STATUT UNIQUEMENT
                console.log('📝 Modification du statut...');
                const statusResponse = await fetch(`/api/rendezvous/${rdvId}/statut`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ statut: newStatut })
                });
                
                const statusResult = await statusResponse.json();
                console.log('📊 Réponse:', statusResult);
                
                if (statusResult.success) {
                    console.log('✅ STATUT MODIFIÉ:', newStatut);
                    
                    // MISE À JOUR IMMÉDIATE DANS L'INTERFACE SANS RECHARGEMENT
                    updateRdvInInterface(rdvId, {
                        statut: newStatut,
                        date: newDate,
                        heure: newHeure,
                        motif: newMotif,
                        notes: newNotes
                    });
                    
                    showNotification(`Statut modifié vers "${newStatut}" avec succès!`, 'success');
                    closeEditModal();
                    
                    // Modifier aussi les autres données en arrière-plan
                    if (newDate && newHeure && (newMotif || newNotes)) {
                        const formData = {
                            dateHeure: `${newDate}T${newHeure}:00`,
                            motif: newMotif,
                            notes: newNotes
                        };
                        
                        fetch(`/api/rendezvous/${rdvId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(formData)
                        }).then(response => response.json())
                        .then(result => {
                            if (result.success) {
                                console.log('✅ Autres données mises à jour');
                            }
                        });
                    }
                    
                } else {
                    console.error('❌ Erreur:', statusResult);
                    showNotification('Erreur: ' + (statusResult.error || statusResult.message), 'error');
                }
                
            } catch (error) {
                console.error('❌ Erreur:', error);
                showNotification('Erreur de connexion', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sauvegarder';
            }
        });

        // Fonction pour mettre à jour un RDV directement dans l'interface
        function updateRdvInInterface(rdvId, newData) {
            console.log('🔄 Mise à jour interface directe pour:', rdvId);
            
            // Mettre à jour dans les données locales
            const rdvIndex = allRendezVous.findIndex(r => r.id === rdvId);
            if (rdvIndex !== -1) {
                // Mettre à jour les données
                if (newData.statut) allRendezVous[rdvIndex].statut = newData.statut;
                if (newData.date) allRendezVous[rdvIndex].date = newData.date;
                if (newData.heure) allRendezVous[rdvIndex].heure = newData.heure;
                if (newData.motif !== undefined) allRendezVous[rdvIndex].motif = newData.motif;
                if (newData.notes !== undefined) allRendezVous[rdvIndex].notes = newData.notes;
                
                console.log('✅ Données locales mises à jour');
                
                // Mettre à jour filteredRendezVous aussi
                const filteredIndex = filteredRendezVous.findIndex(r => r.id === rdvId);
                if (filteredIndex !== -1) {
                    if (newData.statut) filteredRendezVous[filteredIndex].statut = newData.statut;
                    if (newData.date) filteredRendezVous[filteredIndex].date = newData.date;
                    if (newData.heure) filteredRendezVous[filteredIndex].heure = newData.heure;
                    if (newData.motif !== undefined) filteredRendezVous[filteredIndex].motif = newData.motif;
                    if (newData.notes !== undefined) filteredRendezVous[filteredIndex].notes = newData.notes;
                }
                
                // Réafficher immédiatement
                updateStatistics();
                displayRendezVous();
                
                console.log('✅ Interface mise à jour immédiatement');
                
                // Vérification en arrière-plan après 3 secondes
                setTimeout(async () => {
                    console.log('🔍 Vérification en arrière-plan...');
                    try {
                        const verifyResponse = await fetch(`/api/rendezvous?t=${Date.now()}`);
                        const verifyData = await verifyResponse.json();
                        
                        if (verifyData.success) {
                            const verifiedRdv = verifyData.data.find(r => r.id === rdvId);
                            if (verifiedRdv && verifiedRdv.statut !== newData.statut) {
                                console.log('⚠️ Différence détectée, rechargement...');
                                await loadRendezVous();
                            } else {
                                console.log('✅ Vérification OK, statut correct');
                            }
                        }
                    } catch (error) {
                        console.log('⚠️ Erreur vérification:', error);
                    }
                }, 3000);
                
            } else {
                console.log('❌ RDV non trouvé dans les données locales');
            }
        }

        // Supprimer un rendez-vous
        async function deleteRendezVous(rdvId) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce rendez-vous ?')) return;
            
            try {
                const response = await fetch(`/api/rendezvous/${rdvId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('Rendez-vous supprimé avec succès', 'success');
                    await loadRendezVous(); // Recharger
                } else {
                    showNotification('Erreur lors de la suppression', 'error');
                }
            } catch (error) {
                console.error('Erreur:', error);
                showNotification('Erreur de connexion', 'error');
            }
        }

        // Créer un nouveau RDV (redirection vers le calendrier)
        function createNewRdv() {
            window.location.href = '/calendrier.html';
        }

        // Fonction de notification
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            const colors = {
                success: 'bg-green-500',
                error: 'bg-red-500',
                info: 'bg-blue-500'
            };
            
            notification.className = `fixed top-6 right-6 z-50 px-6 py-4 rounded-xl shadow-2xl text-white min-w-[300px] ${colors[type]}`;
            notification.textContent = message;
            notification.classList.remove('hidden');
            
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
